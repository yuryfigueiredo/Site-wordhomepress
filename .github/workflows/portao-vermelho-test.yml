name: prova do portão vermelho (descartável)

# Reproduz o passo "Commit do que a rodada mudou" do turno.yml num runner real:
# interpolação de steps.<id>.outcome, pathspec do git clean e o caso em que a
# rodada falha DEPOIS de um commit publish: legítimo. Este arquivo é apagado
# assim que a prova rodar.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rodada que falha
        id: rodada
        run: exit 1
        continue-on-error: true

      - name: Simular resíduo de publicação abortada
        run: |
          printf ' <!-- resíduo -->\n' >> index.html
          printf '\n{"id":"fake","content":"x"}\n' >> js/articles-db.js
          echo '<html>suja</html>' > a-fake-materia.html
          mkdir -p images/covers && echo '<svg/>' > images/covers/fake.svg
          echo 'sujo' > pipeline/memory.json
          git status --porcelain

      - name: Aplicar o portão
        run: |
          set -e
          echo "outcome da rodada = ${{ steps.rodada.outcome }}"
          if [ "${{ steps.rodada.outcome }}" != "success" ]; then
            for p in js index.html culture.html tech.html science.html sitemap.xml vercel.json images; do
              git checkout HEAD -- "$p" 2>/dev/null || true
            done
            git clean -fdq -- 'a-*.html' 'r-*.html' images 2>/dev/null || true
          fi
          echo "--- sobrou para o git add -A? ---"
          git status --porcelain
          sobra=$(git status --porcelain | grep -v '^ M pipeline/memory.json$' || true)
          if [ -n "$sobra" ]; then echo "FALHOU: resíduo de site chegaria ao commit"; echo "$sobra"; exit 1; fi
          echo "OK: só o registro (pipeline/memory.json) sobrevive"

      - name: Portão não apaga quem publicou de verdade
        run: |
          set -e
          git config user.name teste && git config user.email teste@local
          printf ' <!-- peça legítima já em HEAD -->\n' >> index.html
          git commit -aqm "publish: matéria legítima (nota 8.0)"
          printf ' <!-- resíduo de outra etapa -->\n' >> index.html
          echo '<html>órfã</html>' > a-orfa.html
          if [ "${{ steps.rodada.outcome }}" != "success" ]; then
            for p in js index.html culture.html tech.html science.html sitemap.xml vercel.json images; do
              git checkout HEAD -- "$p" 2>/dev/null || true
            done
            git clean -fdq -- 'a-*.html' 'r-*.html' images 2>/dev/null || true
          fi
          if grep -q 'peça legítima já em HEAD' index.html; then
            echo "OK: a publicação legítima (já commitada como publish:) continua no ar"
          else
            echo "FALHOU: o portão descartou trabalho válido"; exit 1
          fi
