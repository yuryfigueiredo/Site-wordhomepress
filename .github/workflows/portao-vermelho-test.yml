name: prova do portão vermelho v2 (descartável)

# Reproduz o passo "Commit do que a rodada mudou" do turno.yml, na versão de
# recuo geral, no runner de verdade. Apagado assim que rodar.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rodada que falha
        id: rodada
        run: exit 1
        continue-on-error: true

      - name: Resíduo de uma publicação que morreu no meio
        run: |
          printf ' <!-- resíduo -->\n' >> index.html
          printf ' MUDOU\n' >> pipeline/scores.json
          printf ' MUDOU\n' >> voice/state/last_runs.json
          printf 'BROKEN\n' >> js/articles-db.js
          echo '<html>suja</html>' > a-fake-materia.html
          mkdir -p images/covers && echo '<svg/>' > images/covers/fake.svg
          echo '{"leads":{},"publishes":[{"id":"registro-da-rodada"}]}' > pipeline/memory.json
          printf '# Turno — teste\n- fim — rodada vermelha.\n' > TURNO.md
          echo 'rastro' > pipeline/memory.json.tmp
          echo 'ignorado' > pipeline/state/nao-apagar.txt
          git status --porcelain

      - name: Aplicar o portão (recuo geral)
        run: |
          set -e
          echo "outcome da rodada = ${{ steps.rodada.outcome }}"
          if [ "${{ steps.rodada.outcome }}" != "success" ]; then
            mkdir -p /tmp/registro
            cp -f TURNO.md /tmp/registro/ 2>/dev/null || true
            cp -f pipeline/memory.json /tmp/registro/memory.json 2>/dev/null || true
            git checkout HEAD -- .
            git clean -fdq
            cp -f /tmp/registro/TURNO.md ./TURNO.md 2>/dev/null || true
            cp -f /tmp/registro/memory.json pipeline/memory.json 2>/dev/null || true
            git status --porcelain
          fi
          sobra=$(git status --porcelain | grep -Ev '^ M (pipeline/memory\.json|TURNO\.md)$' || true)
          if [ -n "$sobra" ]; then echo "FALHOU: resíduo de site chegaria ao commit"; echo "$sobra"; exit 1; fi
          grep -q 'registro-da-rodada' pipeline/memory.json || { echo "FALHOU: o registro foi apagado"; exit 1; }
          grep -q 'rodada vermelha' TURNO.md || { echo "FALHOU: o relatório foi apagado"; exit 1; }
          test -f pipeline/state/nao-apagar.txt || { echo "FALHOU: git clean mexeu em arquivo ignorado"; exit 1; }
          echo "OK: só TURNO.md e pipeline/memory.json sobrevivem, ignorados intactos"

      - name: Publicação legítima (já em HEAD) sobrevive
        run: |
          set -e
          git config user.name teste && git config user.email teste@local
          printf ' <!-- peça legítima já em HEAD -->\n' >> index.html
          git commit -aqm "publish: matéria legítima (nota 8.0)"
          printf ' <!-- resíduo de outra etapa -->\n' >> index.html
          printf ' nota \xf3rfã\n' >> pipeline/scores.json
          echo '<html>órfã</html>' > a-orfa.html
          if [ "${{ steps.rodada.outcome }}" != "success" ]; then
            mkdir -p /tmp/registro
            cp -f TURNO.md /tmp/registro/ 2>/dev/null || true
            cp -f pipeline/memory.json /tmp/registro/memory.json 2>/dev/null || true
            git checkout HEAD -- .
            git clean -fdq
            cp -f /tmp/registro/TURNO.md ./TURNO.md 2>/dev/null || true
            cp -f /tmp/registro/memory.json pipeline/memory.json 2>/dev/null || true
          fi
          grep -q 'peça legítima já em HEAD' index.html || { echo "FALHOU: o portão descartou trabalho válido"; exit 1; }
          grep -q 'resíduo de outra etapa' index.html && { echo "FALHOU: resíduo ficou"; exit 1; }
          test -f a-orfa.html && { echo "FALHOU: página órfã ficou"; exit 1; }
          echo "OK: a peça publicada de verdade continua no ar e o resíduo sumiu"
