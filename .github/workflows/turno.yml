name: turno editorial

on:
  schedule:
    # O cron do GitHub é SEMPRE UTC, não aceita fuso. Estas 5 horas viram
    # 04, 07, 11, 14 e 18 no horário de Brasília. O teto de publicação mora em
    # pipeline/cadence.json, não aqui.
    - cron: "0 7,10,14,17,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: turno
  cancel-in-progress: false

jobs:
  turno:
    runs-on: ubuntu-latest
    # A rodada pode chamar o escritor 4x (1 rascunho + 3 reescritas), 6 min cada
    # no pior caso. 25 min matava o processo antes do commit do relatório.
    timeout-minutes: 45
    env:
      # Só o que existir em Secrets vira chave; segredo ausente fica vazio e o
      # provedor correspondente é pulado. A ordem de tentativa mora em
      # pipeline/providers.json — aqui só se entrega o que já foi guardado.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rodada do robô
        run: node tools/turno.js

      - name: Commit do que a rodada mudou
        if: always()
        run: |
          git config user.name "homeworld-press-bot"
          git config user.email "bot@homeworldpress.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nada para commitar"
          else
            git commit -m "turno: $(date -u +%Y-%m-%dT%H:%M)Z"
            git push
          fi
