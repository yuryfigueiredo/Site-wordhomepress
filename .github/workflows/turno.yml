name: turno editorial

on:
  schedule:
    # O cron do GitHub é SEMPRE UTC, não aceita fuso. Estas 6 horas viram
    # 00, 04, 08, 12, 16 e 20 no horário de Brasília, de 4 em 4 horas.
    # Minuto 23, não 0: medido em 34 rodadas (out-nov/2026), os horários
    # 07/10/17 UTC nunca dispararam e os demais chegaram de 1 a 170 minutos
    # atrasados — fora da fila das horas cheias, a entrega melhora e a folga de
    # 1h por horário é o que mantém a distância mínima de 3h de
    # pipeline/cadence.json de pé mesmo com atraso. O teto de publicação mora
    # em pipeline/cadence.json, não aqui; o doctor confere os dois.
    - cron: "23 3,7,11,15,19,23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # notify-foto.js abre issue quando a busca de foto falha; sem isso o
  # GITHUB_TOKEN recebe 403 e o alerta se cala.
  issues: write

concurrency:
  group: turno
  cancel-in-progress: false

jobs:
  turno:
    runs-on: ubuntu-latest
    # A rodada pode chamar o escritor 4x (1 rascunho + 3 reescritas), 6 min cada
    # no pior caso. 25 min matava o processo antes do commit do relatório.
    timeout-minutes: 45
    env:
      # Só o que existir em Secrets vira chave; segredo ausente fica vazio e o
      # provedor correspondente é pulado. A ordem de tentativa mora em
      # pipeline/providers.json — aqui só se entrega o que já foi guardado.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2 }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # A busca de foto real lê estas duas; chave ausente = candidato pulado,
      # e sem nenhuma o portão do publish trava a rodada inteira.
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
    steps:
      # O clone raso esconde os commits do dia: o teto de cadência e a memória
      # anti-repetição leem o histórico, então ele precisa vir inteiro.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # A identidade vem antes da rodada: publish.js faz o próprio commit e,
      # sem user.name/email, ele falhava calado e o teto nunca contava a peça.
      - name: Identidade do robô
        run: |
          git config user.name "homeworld-press-bot"
          git config user.email "bot@homeworldpress.com"

      - name: Rodada do robô
        id: rodada
        run: node tools/turno.js

      - name: Commit do que a rodada mudou
        if: always()
        run: |
          # Rodada vermelha não publica nada. O publish.js já desfaz a inserção
          # quando ele mesmo falha, mas um estouro fora daquele caminho (ou um
          # crash do node) deixaria resíduo no diretório — e o `git add -A`
          # abaixo empurraria a matéria ao ar com o rótulo "turno:", sem commit
          # "publish:" e sem contabilidade para o teto.
          # Recuo GERAL, não lista de caminhos: uma saída nova de qualquer
          # ferramenta não pode escapar do portão por esquecimento. O registro
          # (TURNO.md e pipeline/memory.json) volta ao lugar porque é o que diz
          # o que a rodada tentou e impede a mesma fonte de ser reofertada.
          # O publish: legítimo já é HEAD, então a peça publicada de verdade
          # sobrevive ao recuo.
          if [ "${{ steps.rodada.outcome }}" != "success" ]; then
            mkdir -p /tmp/registro
            cp -f TURNO.md /tmp/registro/ 2>/dev/null || true
            cp -f pipeline/memory.json /tmp/registro/memory.json 2>/dev/null || true
            git checkout HEAD -- .
            git clean -fdq
            cp -f /tmp/registro/TURNO.md ./TURNO.md 2>/dev/null || true
            cp -f /tmp/registro/memory.json pipeline/memory.json 2>/dev/null || true
            git status --porcelain
          fi
          git add -A
          if git diff --cached --quiet; then
            echo "nada para commitar"
            exit 0
          fi
          git commit -m "turno: $(date -u +%Y-%m-%dT%H:%M)Z"
          # Se você empurrou algo durante a rodada, o push direto seria recusado
          # e a matéria publicada se perderia no runner. Rebase resolve a corrida.
          # Conflito de verdade só existe onde duas mãos escreveram o mesmo trecho:
          # aqui, os arquivos que a rodada REGENERA (estado da capa, fallback do
          # hero, HTML de índice/artigo, sitemap, as rewrites do vercel.json,
          # TURNO.md) e que o próximo build refaz do zero. Nesses, favorece-se o
          # commit da rodada.
          # `-X theirs` global foi o jeito fácil e era um risco maior que o
          # problema: o mesmo flag que conserta cover-state.json jogaria fora o
          # hunk do outro lado em js/articles-db.js ou pipeline/memory.json — ou
          # seja, apagaria uma matéria já publicada ou o registro que o teto lê.
          # Catálogo, notas e memória continuam bloqueando: vermelho e resolvido
          # à mão vale mais que publicação silenciosamente perdida.
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              exit 0
            fi
            echo "rebase parou por conflito (tentativa $i): resolvendo só o que a rodada regenera"
            for f in $(git diff --name-only --diff-filter=U); do
              case "$f" in
                TURNO.md|pipeline/state/*|index.html|culture.html|tech.html|science.html|sitemap.xml|vercel.json|a-*.html|r-*.html)
                  git checkout --theirs -- "$f" && git add -- "$f" || true
                  echo "  conflito resolvido a favor da rodada: $f" ;;
                *)
                  echo "  BLOQUEANTE: conflito em $f (catálogo/notas/memória) — nada é jogado fora" ;;
              esac
            done
            if GIT_EDITOR=true git rebase --continue && git push; then
              echo "push resolvido favorecendo os arquivos regeneráveis desta rodada"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push recusado (tentativa $i), repetindo em 10s"
            sleep 10
          done
          # Nada saiu e o histórico local pode estar no meio de um rebase: o
          # runner morre assim mesmo, mas o log diz exatamente onde parou.
          git status --porcelain
          exit 1
